plugins {
    id 'com.android.application'
    id 'kotlin-android'
}

android {
    compileSdk 34

    defaultConfig {
        applicationId 'br.com.uol.pagseguro.plugpagintegradores'
        namespace 'br.com.uol.pagseguro.plugpagintegradores'
        minSdk 21
        targetSdk 33
        versionCode 1
        versionName "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17
    }
    buildFeatures {
        viewBinding = true
    }
}

dependencies {
    implementation 'br.com.uol.pagseguro:plugpag:4.15.1'

    implementation 'androidx.core:core-ktx:1.6.0'
    implementation 'androidx.appcompat:appcompat:1.3.1'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.1'
    implementation 'androidx.work:work-runtime:2.7.1'

    //Kodein DI
    implementation "org.kodein.di:kodein-di-generic-jvm:6.5.5"
    implementation "org.kodein.di:kodein-di-conf-jvm:6.5.5"
    implementation "org.kodein.di:kodein-di-framework-android-core:6.5.5"
    implementation "org.kodein.di:kodein-di-framework-android-x:6.5.5"

    //Rx
    implementation 'io.reactivex.rxjava3:rxandroid:3.0.0'
    implementation("io.reactivex.rxjava3:rxkotlin:3.0.0")

    //ZXING
    implementation "com.google.zxing:core:3.3.0"
}